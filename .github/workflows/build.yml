name: Build GlobalHotbarFontCN_ACT

# 推送代码：只编译，检查能否通过
# 推送 v 开头的四位版本标签（如 v1.0.0.1）：用标签里的版本号编译，并创建 GitHub Release 附上 DLL
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # 创建 Release

env:
  PROJECT: HotbarFontACT/HotbarFontACT.csproj
  DLL: HotbarFontACT/bin/Release/GlobalHotbarFontCN_ACT.dll

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 编译
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
            echo "正式版：${GITHUB_REF_NAME#v}"
          fi
          dotnet build $PROJECT -c Release $VERSION_ARG

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: GlobalHotbarFontCN_ACT
          path: ${{ env.DLL }}

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DLL" \
            --title "GlobalHotbarFontCN_ACT $GITHUB_REF_NAME" \
            --notes "下载 GlobalHotbarFontCN_ACT.dll，在 ACT 的「插件列表」中添加并启用。"
